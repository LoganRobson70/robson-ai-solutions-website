[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/holding.html"
  status = 200
  force = true

[[redirects]]
  from = "/preview.html"
  to = "/"
  status = 301
  force = true

[[edge_functions]]
  function = "preview-auth"
  path = "/index.html"

[[edge_functions]]
  function = "preview-auth"
  path = "/building-analyst.html"

[[edge_functions]]
  function = "preview-auth"
  path = "/who-its-for.html"

[[edge_functions]]
  function = "preview-auth"
  path = "/privacy.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/favicon-32x32.png"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/favicon-16x16.png"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
